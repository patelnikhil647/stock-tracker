# stock-tracker configuration — EXAMPLE / TEMPLATE
#
# This file is committed to git and is only an example. Do NOT put your real
# private ntfy topic here. Instead, copy it to config.local.yaml (which is
# gitignored) and set your real values there:
#
#     cp config.example.yaml config.local.yaml
#
# At runtime, config.local.yaml is deep-merged OVER this file: any key you set
# in config.local.yaml wins, and anything you omit falls back to the value here.

# Fraction below the 52-week high that triggers an alert. 0.15 = 15%.
threshold: 0.15

ntfy:
  # Public ntfy server. You can self-host and change this if you prefer.
  server: "https://ntfy.sh"
  # Set your own private topic in config.local.yaml (treat it like a password —
  # anyone who knows the topic can read/send your notifications on the public
  # server). The placeholder below is rejected at runtime on purpose.
  topic: "CHANGE-ME-stock-tracker-a1b2c3"
  # Notification priority sent to ntfy: min, low, default, high, urgent.
  priority: "high"

# Only run the actual check during US market hours (America/New_York).
# `check` is a no-op outside this window so an over-eager cron schedule is safe.
# Set enabled: false to always run (useful for testing).
market_hours:
  enabled: true
  timezone: "America/New_York"
  open: "09:30"
  close: "16:00"
  # 0 = Monday ... 6 = Sunday
  weekdays: [0, 1, 2, 3, 4]

# Where the SQLite alert-state database lives (relative to project root).
state_db: "data/state.db"
